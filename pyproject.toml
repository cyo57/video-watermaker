[project]
name = "video-watermaker"
version = "0.2.0"
description = "Resumable video directory queues, contact sheets and capped 720p compression"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pillow>=12.0.0",
    "textual>=6.0,<9",
]

[project.optional-dependencies]
speech = [
    "faster-whisper==1.2.1",
    "pyannote-audio==4.0.7",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
    "huggingface-hub>=0.36,<1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
